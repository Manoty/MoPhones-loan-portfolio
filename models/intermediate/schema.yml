  - name: int_customer_segments
    description: "Customer age and age segmentation calculated from DOB at reporting date."
    columns:
      - name: loan_id
        tests:
          - not_null

      - name: snapshot_date
        tests:
          - not_null

      - name: age
        description: "Customer age at snapshot date"

      - name: age_segment
        description: "Age bucket used for portfolio analysis"
